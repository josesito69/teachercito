<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Emotion</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Guess the Emotion!</h1>
        <p id="emoji" class="emoji">😊</p>
        <p>Time left: <span id="timer">20</span> sec</p>
        <p>Attempts left: <span id="attempts">5</span></p>
        <div id="options"></div>
        <p id="feedback"></p>
        <p id="feedback"></p>
        <center>
            <button id="restartButton" onclick="restartGame()" style="display: none;">Try Again</button>
        </center>
        <p>Score: <span id="score">0</span></p>
    </div>
    <audio id="correctSound" src="correct.mp3"></audio>
    <audio id="wrongSound" src="wrong.mp3"></audio>
    <script src="script/script.js"></script>
</body>
</html>
