<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello and Goodbye Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #6a11cb, #2575fc);
      color: white;
      padding: 20px;
    }
    .game-container {
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 15px;
      width: 90%;
      max-width: 800px;
      margin: auto;
    }
    .instructions {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .game-board {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }
    .column {
      flex: 1;
      min-width: 250px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .question, .answer {
      background-color: white;
      color: black;
      padding: 12px;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
      user-select: none;
      transition: background 0.3s, transform 0.2s;
    }
    .answer {
      border: 2px solid transparent;
    }
    .answer:hover {
      background: #f0f0f0;
    }
    .dragging {
      opacity: 0.5;
      transform: scale(1.1);
    }
    .correct {
      background: #4caf50 !important;
      color: white;
      border: 2px solid #2e7d32;
    }
    .incorrect {
      background: #e57373 !important;
      color: white;
      border: 2px solid #c62828;
    }
    .highlight {
      border: 2px dashed #ffffff !important;
    }
    .score {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
    .buttons {
      margin-top: 20px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      background: #ff9800;
      color: white;
      font-weight: bold;
      transition: background 0.3s;
    }
    button:hover {
      background: #e68900;
    }
    .menu-button {
      position: fixed;
      top: 10px;
      left: 10px;
    }
    
    /* 🟢 RESPONSIVIDAD PARA TELÉFONOS */
    @media (max-width: 600px) {
      .game-board {
        flex-direction: column;
        align-items: center;
      }
      .column {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <button class="menu-button" onclick="goToMenu()">Back to Menu</button>
  <div class="game-container">
    <h1>Greetings and Farewells</h1>
    <p class="instructions">Drag and drop the correct greeting or farewell into its matching description.</p>
    <div class="game-board">
      <div class="column" id="questions"></div>
      <div class="column" id="answers"></div>
    </div>
    <div class="score">Score: <span id="score">0</span></div>
    <div class="buttons">
      <button onclick="restartGame()">Restart</button>
    </div>
  </div>

  <script>
    const questionsData = [
      { text: "Meeting someone for the first time", answer: "Hello" },
      { text: "Casual greeting in the morning", answer: "Good morning" },
      { text: "Greeting a friend in the afternoon", answer: "Good afternoon" },
      { text: "Greeting someone in the evening", answer: "Good evening" },
      { text: "Casual greeting to a friend", answer: "Hi" },
      { text: "Leaving a place and saying farewell", answer: "Goodbye" },
      { text: "Saying you will see someone again", answer: "See you" },
      { text: "Wishing someone well before leaving", answer: "Take care" },
      { text: "Saying you will see someone in a short while", answer: "See you later" },
      { text: "A formal way to say goodbye", answer: "Farewell" }
    ];

    let score = 0;

    function createGameElements() {
      const questionsContainer = document.getElementById("questions");
      const answersContainer = document.getElementById("answers");
      questionsContainer.innerHTML = "";
      answersContainer.innerHTML = "";
      score = 0;
      document.getElementById("score").textContent = score;

      const shuffledQuestions = [...questionsData].sort(() => Math.random() - 0.5);
      const shuffledAnswers = [...questionsData].map(q => q.answer).sort(() => Math.random() - 0.5);

      shuffledQuestions.forEach(q => {
        const div = document.createElement("div");
        div.classList.add("question");
        div.textContent = q.text;
        div.dataset.answer = q.answer;
        div.ondrop = drop;
        div.ondragover = allowDrop;
        div.ondragenter = highlight;
        div.ondragleave = removeHighlight;
        questionsContainer.appendChild(div);
      });

      shuffledAnswers.forEach(answer => {
        const div = document.createElement("div");
        div.classList.add("answer");
        div.textContent = answer;
        div.draggable = true;
        div.ondragstart = dragStart;
        div.ondragend = dragEnd;
        answersContainer.appendChild(div);
      });
    }

    function dragStart(event) {
      event.dataTransfer.setData("text", event.target.textContent);
      setTimeout(() => event.target.classList.add("dragging"), 0);
    }

    function dragEnd(event) {
      event.target.classList.remove("dragging");
    }

    function allowDrop(event) {
      event.preventDefault();
    }

    function highlight(event) {
      event.preventDefault();
      event.target.classList.add("highlight");
    }

    function removeHighlight(event) {
      event.target.classList.remove("highlight");
    }

    function drop(event) {
      event.preventDefault();
      const draggedText = event.dataTransfer.getData("text");
      const target = event.target;
      target.classList.remove("highlight");

      if (target.classList.contains("question")) {
        if (target.dataset.answer === draggedText) {
          target.classList.add("correct");
          target.textContent += ` ➝ ${draggedText}`;
          score++;
        } else {
          target.classList.add("incorrect");
        }

        document.getElementById("score").textContent = score;

        document.querySelectorAll(".answer").forEach(answer => {
          if (answer.textContent === draggedText) {
            answer.remove();
          }
        });
      }
    }

    function restartGame() {
      createGameElements();
    }

    function goToMenu() {
      window.location.href = "index.html";
    }

    createGameElements();
  </script>
</body>
</html>
