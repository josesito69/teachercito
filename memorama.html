<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game - Adjectives</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            position: relative;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 10px;
            justify-content: center;
            max-width: 380px;
            margin: 20px auto;
        }
        .card {
            width: 100%;
            height: 100px;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border-radius: 10px;
        }
        .flipped {
            background-color: #2ecc71;
        }
        .matched {
            background-color: #f1c40f;
            cursor: default;
        }
        .button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #e74c3c;
            color: white;
        }
        .button:hover {
            background-color: #c0392b;
        }
        .top-left {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #2c3e50;
        }
        @media (max-width: 500px) {
            .card {
                height: 70px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <button class="button top-left" onclick="window.location.href='index.html'">Back to Menu</button>
    <h1>Memory Game - Adjectives</h1>
    <h2>Pairs found: <span id="matchCount">0</span></h2>
    <h2>Time left: <span id="timer">60</span> seconds</h2>
    <div class="grid" id="gameBoard"></div>
    <button class="button" onclick="location.reload()">Play Again</button>
    <script>
        const adjectives = [
            { word: "Big", translation: "Grande" },
            { word: "Small", translation: "Pequeño" },
            { word: "Happy", translation: "Feliz" },
            { word: "Sad", translation: "Triste" },
            { word: "Fast", translation: "Rápido" },
            { word: "Slow", translation: "Lento" },
            { word: "Young", translation: "Joven" },
            { word: "Old", translation: "Viejo" }
        ];
        
        let cards = [...adjectives, ...adjectives.map(a => ({ word: a.translation, translation: a.word }))];
        cards = cards.sort(() => Math.random() - 0.5);
        
        const gameBoard = document.getElementById("gameBoard");
        const matchCountElement = document.getElementById("matchCount");
        const timerElement = document.getElementById("timer");
        let flippedCards = [];
        let matchedPairs = 0;
        let timeLeft = 60;

        function startTimer() {
            const timerInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("Time's up! Try again.");
                    location.reload();
                }
                if (matchedPairs === adjectives.length) {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }
        
        startTimer();
        
        cards.forEach((adjective) => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.dataset.word = adjective.word;
            card.dataset.translation = adjective.translation;
            card.textContent = "?";
            
            card.addEventListener("click", () => {
                if (flippedCards.length < 2 && !card.classList.contains("flipped") && !card.classList.contains("matched")) {
                    card.classList.add("flipped");
                    card.textContent = adjective.word;
                    flippedCards.push(card);
                }
                
                if (flippedCards.length === 2) {
                    setTimeout(() => {
                        const [card1, card2] = flippedCards;
                        if ((card1.dataset.word === card2.dataset.translation) || (card2.dataset.word === card1.dataset.translation)) {
                            flippedCards.forEach(c => c.classList.add("matched"));
                            matchedPairs++;
                            matchCountElement.textContent = matchedPairs;
                            if (matchedPairs === adjectives.length) {
                                alert("Congratulations! You found all pairs.");
                            }
                        } else {
                            flippedCards.forEach(c => {
                                c.classList.remove("flipped");
                                c.textContent = "?";
                            });
                        }
                        flippedCards = [];
                    }, 1000);
                }
            });
            
            gameBoard.appendChild(card);
        });
    </script>
</body>
</html>
