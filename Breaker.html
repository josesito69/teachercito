<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Click Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }
        .container {
            margin: 50px auto;
            width: 80%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            height: 300px;
        }
        #click-btn {
            position: absolute;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #click-btn:hover {
            background-color: #218838;
        }
        #score {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Quick Click Challenge!</h1>
        <p>Click the moving button as many times as you can in <b>15 seconds!</b></p>
        <button id="click-btn">Click Me!</button>
        <p id="score">Score: 0</p>
    </div>

    <script>
        let score = 0;
        let timeLeft = 15;
        let gameActive = true;
        
        const button = document.getElementById("click-btn");
        const scoreDisplay = document.getElementById("score");

        function moveButton() {
            if (!gameActive) return;

            let x = Math.random() * 80 + "%";
            let y = Math.random() * 80 + "%";

            button.style.left = x;
            button.style.top = y;
        }

        button.onclick = function() {
            if (gameActive) {
                score++;
                scoreDisplay.textContent = "Score: " + score;
                moveButton();
            }
        };

        function startTimer() {
            let countdown = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    gameActive = false;
                    alert("Time's up! Your final score is: " + score);
                }
            }, 1000);
        }

        moveButton();
        startTimer();
    </script>
</body>
</html>
