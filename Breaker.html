<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare the Animals!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        .game-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .images img {
            width: 100px;
            margin: 10px;
        }

        .options button {
            display: block;
            width: 80%;
            margin: 5px auto;
            padding: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #feedback {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Compare the Animals!</h1>
        <p id="question">Which is ______?</p>
        <div class="images">
            <img id="img1" src="elephant.png" alt="Animal 1">
            <img id="img2" src="dog.png" alt="Animal 2">
        </div>
        <div class="options">
            <button onclick="checkAnswer(0)"></button>
            <button onclick="checkAnswer(1)"></button>
            <button onclick="checkAnswer(2)"></button>
        </div>
        <p id="feedback"></p>
        <p id="score">Score: 0</p>
    </div>

    <script>
        const questions = [
            { img1: "elephant.png", img2: "dog.png", adjective: "big", answer: "bigger", options: ["bigger", "biggest", "more big"] },
            { img1: "rabbit.png", img2: "turtle.png", adjective: "fast", answer: "faster", options: ["fastest", "faster", "more fast"] },
            { img1: "giraffe.png", img2: "cat.png", adjective: "tall", answer: "taller", options: ["tallest", "taller", "more tall"] }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            let q = questions[currentQuestion];
            document.getElementById("question").textContent = `Which is ${q.adjective}?`;
            document.getElementById("img1").src = q.img1;
            document.getElementById("img2").src = q.img2;

            let buttons = document.querySelectorAll(".options button");
            q.options.forEach((opt, index) => {
                buttons[index].textContent = opt;
            });
        }

        function checkAnswer(index) {
            let q = questions[currentQuestion];
            let selected = q.options[index];

            if (selected === q.answer) {
                document.getElementById("feedback").textContent = "Correct!";
                score++;
            } else {
                document.getElementById("feedback").textContent = "Try again!";
            }

            document.getElementById("score").textContent = `Score: ${score}`;

            currentQuestion++;
            if (currentQuestion < questions.length) {
                setTimeout(() => {
                    document.getElementById("feedback").textContent = "";
                    loadQuestion();
                }, 1000);
            } else {
                setTimeout(() => {
                    alert(`Game Over! Your score is ${score}`);
                    location.reload();
                }, 1000);
            }
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
