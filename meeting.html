<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting People & Basic Expressions Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      color: white;
      padding: 20px;
    }
    .game-container {
      background: rgba(255, 255, 255, 0.2);
      padding: 20px;
      border-radius: 15px;
      display: inline-block;
      max-width: 500px;
      position: relative;
    }
    .dialogue {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .options button, .retry-button, .menu-button {
      background-color: white;
      color: black;
      border: none;
      padding: 10px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    .options button:hover, .retry-button:hover, .menu-button:hover {
      background-color: lightgray;
    }
    .menu-button {
      position: absolute;
      top: 10px;
      left: 10px;
    }
  </style>
</head>
<body>
  <button class="menu-button" onclick="goToMenu()">Back to Menu</button>
  <div class="game-container">
    <h1>Meeting People & Basic Expressions Game</h1>
    <div class="dialogue" id="dialogue">You meet someone new. What do you say?</div>
    <div class="options" id="options"></div>
    <button class="retry-button" id="retry" style="display: none;" onclick="restartGame()">Try Again</button>
  </div>
  
  <script>
    const dialogues = [
      {
        text: "You meet someone new. What do you say?",
        options: [
          { text: "Hello! Nice to meet you.", next: 1 },
          { text: "Hey, who are you?", next: 2 }
        ]
      },
      {
        text: "The person smiles and says, 'Nice to meet you too!' What do you ask next?",
        options: [
          { text: "What's your name?", next: 3 },
          { text: "Where are you from?", next: 4 }
        ]
      },
      {
        text: "The person looks confused and walks away... Try again!",
        options: []
      },
      {
        text: "They reply, 'I'm Alex. What's your name?'",
        options: [
          { text: "I'm [Your Name]!", next: 5 },
          { text: "Nice to meet you, Alex!", next: 6 }
        ]
      },
      {
        text: "They reply, 'I'm from London. How about you?'",
        options: [
          { text: "I'm from [Your City]!", next: 5 },
          { text: "That's interesting! London is a great city.", next: 6 }
        ]
      },
      {
        text: "Alex asks: 'What do you do for fun?'",
        options: [
          { text: "I like to read books.", next: 7 },
          { text: "I enjoy playing sports.", next: 7 }
        ]
      },
      {
        text: "Alex replies: 'That's great! What do you usually say when meeting new people?'",
        options: [
          { text: "I usually say 'Hello! How are you?'.", next: 8 },
          { text: "I say 'Nice to meet you!'.", next: 8 }
        ]
      },
      {
        text: "You have a nice conversation and make a new friend!",
        options: []
      }
    ];

    function loadDialogue(index) {
      const dialogueContainer = document.getElementById("dialogue");
      const optionsContainer = document.getElementById("options");
      const retryButton = document.getElementById("retry");
      dialogueContainer.textContent = dialogues[index].text;
      optionsContainer.innerHTML = "";
      
      if (dialogues[index].options.length === 0) {
        retryButton.style.display = "block";
      } else {
        retryButton.style.display = "none";
      }
      
      dialogues[index].options.forEach(option => {
        const button = document.createElement("button");
        button.textContent = option.text;
        button.onclick = () => loadDialogue(option.next);
        optionsContainer.appendChild(button);
      });
    }
    
    function restartGame() {
      loadDialogue(0);
    }
    
    function goToMenu() {
      window.location.href = "index.html";
    }
    
    loadDialogue(0);
  </script>
</body>
</html>
